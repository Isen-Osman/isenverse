<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background: Deep Slate Gray -->
  <rect width="100" height="100" rx="20" fill="#1a1a2e"/>
  
  <!-- Brackets in Neon Blue -->
  <path d="M28 35 L15 50 L28 65" fill="none" stroke="#00f2ff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M72 35 L85 50 L72 65" fill="none" stroke="#00f2ff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Monogram IO in White -->
  <rect x="38" y="35" width="6" height="30" rx="3" fill="#ffffff"/>
  <circle cx="58" cy="50" r="12" fill="none" stroke="#ffffff" stroke-width="6"/>
  
  <!-- Tech Accent Dot -->
  <circle cx="50" cy="78" r="4" fill="#00f2ff">
    <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
  </circle>
</svg>